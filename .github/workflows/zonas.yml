name: Zonas de otras ciudades
on:
  push:
    paths: ["scripts/zonas.py", ".github/workflows/zonas.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zonas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/zonas.py
      - name: Commit the boundaries
        if: always()
        run: |
          git config user.name "cauce-bot"
          git config user.email "bot@cauce.blog"
          git add data/zonas-*.json || true
          git diff --cached --quiet || (git commit -m "Límites de Margarita y Lechería" && git pull --rebase origin main && git push)
