name: BCV diario
on:
  schedule:
    - cron: "17 23 * * *"   # once a day, 7:17 pm Caracas, after BCV publishes the next day's rate
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/bcv.py
      - name: Commit the new rate
        run: |
          git config user.name "cauce-bot"
          git config user.email "bot@cauce.blog"
          git add data/bcv.json
          git diff --cached --quiet || (git commit -m "BCV: tasa del día" && git push)
