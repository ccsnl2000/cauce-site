name: v360 check (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s 'https://venezuela360.org/server/rest/services/Hosted/Parroquias/FeatureServer/0/query?where=1%3D1&geometry=-67.2%2C10.3%2C-66.6%2C10.6&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=parroquia%2Cmunicipio%2Cestado&outSR=4326&geometryPrecision=6&f=geojson' -o v.json
          python3 - > check.txt <<'PY'
          import json, collections
          j=json.load(open('v.json')); fs=[f for f in j['features'] if f['properties']['municipio'] and f['properties']['municipio'].lower() in ('libertador','chacao','baruta','sucre','el hatillo')]
          c=collections.Counter((f['properties']['estado'],f['properties']['municipio'],f['properties']['parroquia']) for f in fs)
          print('features',len(fs)); print('dups',[k for k,v in c.items() if v>1])
          for f in fs:
            p=f['properties']; g=f['geometry']; polys=[g['coordinates']] if g['type']=='Polygon' else g['coordinates']
            if p['municipio'].lower()=='libertador': print(p['estado'],p['parroquia'],g['type'],len(polys),[len(x) for x in polys],[len(x[0]) for x in polys])
          PY
      - run: |
          git config user.name cauce-bot; git config user.email bot@cauce.blog
          mkdir -p tmp && mv check.txt tmp/v360-check.txt && git add tmp && git commit -m "tmp v360 check" && git pull --rebase origin main && git push
